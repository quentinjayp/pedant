name: Android build

on:
  push:
    branches: [claude/offline-ai-language-app-v3widq, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download sherpa-onnx Android library
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pedant.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: pedant.apk
          body: |
            Debug build from commit ${{ github.sha }}.
            Install pedant.apk on an Android phone (allow installs from unknown sources).

  dictionary-report:
    # Runs every word of the built-in openings through the word bubble's lookup, in every language,
    # and reports what looks wrong (DictionaryReportTest). On dispatch, or on pushes whose commit
    # message contains [dictcheck].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dictcheck]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Download sherpa-onnx Android library
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
      - name: Download the dictionaries
        run: |
          set -eu
          mkdir -p dict
          release=$(python3 -c "import json; print(json.load(open('dictionaries/manifest.json'))['release'])")
          for f in $(python3 -c "import json; print(' '.join(json.load(open('dictionaries/manifest.json'))['languages']))"); do
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$release/$f.db.gz" | gunzip > dict/$f.db
          done
          ls -l dict
      - name: Run the report
        run: DICT_DIR=$PWD/dict ./gradlew --no-daemon :app:testDebugUnitTest --tests com.pedant.app.DictionaryReportTest
      - name: Show the summary
        if: always()
        run: cat app/build/dictionary-report/summary.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dictionary-report
          path: app/build/dictionary-report/

  check-models:
    # Confirms every model file the app downloads exists on Hugging Face.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Hugging Face model files
        run: |
          set -u
          fail=0
          list() { curl -fsS "https://huggingface.co/api/models/$1/tree/main?recursive=true"; }

          echo "== Gemma"
          for r in litert-community/gemma-4-E4B-it-litert-lm litert-community/gemma-4-E2B-it-litert-lm; do
            echo "-- $r"
            list "$r" | jq -r '.[] | select(.type=="file") | "\(.path) \(.lfs.size // .size)"' | grep litertlm || { echo "MISSING $r"; fail=1; }
          done

          echo "== Speech recognizer"
          for r in csukuangfj2/sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12 \
                   csukuangfj/sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12; do
            echo "-- $r"
            list "$r" | jq -r '.[] | select(.type=="file") | .path' | grep -E 'onnx|tokens' || echo "MISSING $r"
          done

          echo "== Piper voices (each language needs at least one)"
          while read -r line; do
            lang=$(echo "$line" | grep -oE 'Language\("[a-z]+", "[^"]+"' | cut -d'"' -f4)
            ok=""
            for v in $(echo "$line" | grep -oE '"[a-z]{2}_[A-Z]{2}-[A-Za-z0-9_]+-(x_low|low|medium|high)"' | tr -d '"'); do
              files=$(list "csukuangfj/vits-piper-$v" 2>/dev/null | jq -r '.[] | select(.type=="file") | .path' || true)
              if echo "$files" | grep -qx "$v.onnx" && echo "$files" | grep -qx tokens.txt && echo "$files" | grep -q '^espeak-ng-data/'; then
                ok=$v; break
              fi
              # Or packaged by this app, on its "voices" release (voices.yml).
              own="https://github.com/$GITHUB_REPOSITORY/releases/download/voices/$v"
              if curl -fsIL -o /dev/null "$own.onnx" && curl -fsIL -o /dev/null "$own.tokens.txt"; then
                ok="$v (this app's release)"; break
              fi
              echo "  missing $v"
            done
            if [ -n "$ok" ]; then echo "OK $lang: $ok"; else echo "NO VOICE $lang"; fail=1; fi
          done < <(grep -E '^\s+Language\(' app/src/main/java/com/pedant/app/Languages.kt)
          exit $fail

  check-zipa:
    # Confirms ZIPA's pronunciation model runs in sherpa-onnx, the speech library the app uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ZIPA through sherpa-onnx
        run: |
          set -eux
          repo=anyspeech/zipa-large-crctc-500k
          curl -fsS "https://huggingface.co/api/models/$repo/tree/main?recursive=true" \
            | jq -r '.[] | select(.type=="file") | "\(.path) \(.lfs.size // .size)"' | tee files.txt
          model=$(awk '{print $1}' files.txt | grep -E 'int8.*\.onnx$|\.int8\.onnx$' | grep -viE 'encoder|decoder|joiner' | head -1)
          curl -fsSL -o model.onnx "https://huggingface.co/$repo/resolve/main/$model"
          curl -fsSL -o sample.wav https://raw.githubusercontent.com/lingjzhu/zipa/main/sample.wav
          curl -fsSL -o tokens.txt https://raw.githubusercontent.com/lingjzhu/zipa/main/ipa_simplified/tokens.txt
          pip install sherpa-onnx==1.13.8 onnx soundfile numpy
          python - <<'PY'
          import onnx
          m = onnx.load("model.onnx")
          print("inputs", [i.name for i in m.graph.input], "outputs", [o.name for o in m.graph.output])
          print("metadata", {p.key: p.value for p in m.metadata_props})
          import sherpa_onnx, soundfile as sf
          rec = sherpa_onnx.OfflineRecognizer.from_zipformer_ctc(
              model="model.onnx", tokens="tokens.txt", num_threads=2, debug=False)
          audio, sr = sf.read("sample.wav", dtype="float32")
          if audio.ndim > 1:
              audio = audio[:, 0]
          s = rec.create_stream()
          s.accept_waveform(sr, audio)
          rec.decode_stream(s)
          print("TEXT:", s.result.text)
          print("TOKENS:", s.result.tokens)
          PY

  check-voices:
    # Has every language's voice read its built-in opening, and flags any that say nothing.
    # Runs on manual dispatch, or on pushes whose commit message contains [voices].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[voices]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the voices
        run: |
          set -u
          mkdir -p voices && cd voices
          # Each language's voices, in the app's order; a missing one is skipped like the app does.
          for v in $(grep -oE '"[a-z]{2}_[A-Z]{2}-[A-Za-z0-9_]+-(x_low|low|medium|high)"' ../app/src/main/java/com/pedant/app/Languages.kt | tr -d '"'); do
            curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-$v.tar.bz2" | tar xj && continue
            # Or packaged by this app, on its "voices" release, with espeak-ng's data from another voice.
            own="https://github.com/$GITHUB_REPOSITORY/releases/download/voices/$v"
            mkdir -p "vits-piper-$v"
            if curl -fsSL -o "vits-piper-$v/$v.onnx" "$own.onnx" && curl -fsSL -o "vits-piper-$v/tokens.txt" "$own.tokens.txt"; then
              echo "$v from this app's release"
            else
              rm -rf "vits-piper-$v"; echo "missing $v"
            fi
          done
          for d in vits-piper-*; do
            [ -d "$d/espeak-ng-data" ] || cp -r vits-piper-en_US-lessac-medium/espeak-ng-data "$d/"
          done
      - name: List the Piper voices for each language
        run: python tools/list_piper_voices.py
      - name: Have each voice speak
        run: |
          pip install sherpa-onnx==1.13.8
          python tools/check_voices.py voices voice-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-check
          path: voice-check/

  calibrate-scoring:
    # Scores real people's speech (FLEURS) against correct and wrong phrases, to set Learning mode's pass marks.
    # Runs on manual dispatch, or on pushes whose commit message contains [calibrate].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[calibrate]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download models
        run: |
          set -eu
          mkdir -p models/zipa && cd models
          # The app's voices, which give the expected sounds.
          for v in fr_FR-siwis-medium es_ES-davefx-medium de_DE-thorsten-medium en_US-lessac-medium; do
            curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-$v.tar.bz2 | tar xj
          done
          curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12.tar.bz2 | tar xj
          curl -fsSL -o zipa/model.int8.onnx https://huggingface.co/anyspeech/zipa-large-crctc-500k/resolve/main/model.int8.onnx
          curl -fsSL -o zipa/tokens.txt https://huggingface.co/anyspeech/zipa-large-crctc-500k/resolve/main/tokens.txt
          # The word dictionaries, for expected sounds taken from the dictionary.
          mkdir -p dict
          release=$(python3 -c "import json; print(json.load(open('../dictionaries/manifest.json'))['release'])")
          for l in fr es de en; do
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$release/$l.db.gz" | gunzip > dict/$l.db
          done
          # Real speech: FLEURS (Google, CC-BY), people reading sentences, from its dev and test splits.
          for code in fr_fr es_419 de_de en_us; do
            mkdir -p fleurs/$code
            base=https://huggingface.co/datasets/google/fleurs/resolve/main/data/$code
            for split in dev test; do
              curl -fsSL -o fleurs/$code/$split.tsv "$base/$split.tsv"
              curl -fsSL "$base/audio/$split.tar.gz" | tar xz -C fleurs/$code
            done
          done
      - name: Score learner voices
        run: |
          # espeak-ng, for the expected sounds Piper is given (the "espeak" method).
          sudo apt-get install -y -qq espeak-ng >/dev/null
          pip install sherpa-onnx==1.13.8
          python tools/calibrate_scoring.py models
