name: Dictionaries

# Builds the word dictionaries from English Wiktionary (via kaikki.org) once a month and publishes
# them as their own release, separate from the app. Every run commits dictionaries/manifest.json
# (at least the date it was checked), which keeps the repository active so GitHub doesn't switch
# the schedule off. Runs on demand too, or on a push whose message contains [dictionaries].

on:
  schedule:
    - cron: "23 7 11 * *"
  workflow_dispatch:
  push:
    branches: [claude/offline-ai-language-app-v3widq, main]

permissions:
  contents: write

concurrency:
  group: dictionaries
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[dictionaries]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # For how common each part of speech is, so "est" (is) shows before "est" (east).
      - name: Get the Universal Dependencies treebanks
        run: |
          set -euo pipefail
          mkdir -p ud
          for repo in $(python3 tools/build_dictionaries.py --list-treebanks); do
            # A treebank that can't be had (renamed, say) is left out rather than failing the run,
            # which would stop the monthly manifest commit.
            git clone --quiet --depth 1 "https://github.com/UniversalDependencies/$repo" "ud/$repo" \
              || echo "::warning::Couldn't get $repo; its language is counted without it"
          done
          du -sh ud

      - name: Build the dictionaries (streams the data; nothing large is saved)
        run: |
          set -euo pipefail
          pip install --quiet orjson
          curl -fsSL --retry 3 https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz \
            | gzip -dc \
            | python3 tools/build_dictionaries.py --forms --out out --ud ud \
                --languages app/src/main/java/com/pedant/app/Languages.kt
          ls -l out

      - name: Update the manifest
        id: manifest
        run: |
          version="$(date -u +%Y-%m-%d)-r${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 tools/update_dictionary_manifest.py --built out/languages.json \
            --manifest dictionaries/manifest.json --version "$version" \
            --checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          cat dictionaries/manifest.json

      # Published before the manifest is committed, so the app never sees a release that isn't there.
      - name: Publish the dictionaries
        if: steps.manifest.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dictionaries-${{ steps.manifest.outputs.version }}
          name: Dictionaries ${{ steps.manifest.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: out/*.db.gz
          body: |
            Word dictionaries for the app, one per language (gzipped SQLite).

            Built from English Wiktionary (https://en.wiktionary.org), text by Wiktionary
            contributors, licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
            Extracted with Wiktextract via kaikki.org: Tatu Ylonen, "Wiktextract: Wiktionary as
            Machine-Readable Structured Data", LREC 2022. Changes: kept only each entry's spelling,
            part of speech, IPA, up to three short English meanings, and the word it is a form of.

            Each entry also holds how often its spelling is that part of speech, counted in
            Universal Dependencies treebanks (https://universaldependencies.org) licensed CC BY-SA
            or CC BY; each file's meta table names the treebanks used.

      - name: Commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionaries/manifest.json
          git commit -m "Dictionaries checked $(date -u +%Y-%m-%d)"
          # Someone may push at the same moment; take their commits and try again.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Remove older dictionary releases (keeps the newest two)
        if: steps.manifest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep "^dictionaries-" | sort -rV | tail -n +3 \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
