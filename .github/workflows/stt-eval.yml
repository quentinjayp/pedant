name: Speech recognition eval

# A one-off eval (tools/stt_eval.py): Gemma 4's speech recognition against Omnilingual's, in the
# app's languages, on accuracy, keeping a learner's mistakes, and a minute of speech. Run on demand
# only. It reports once, in the run's summary, and never blocks a build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download FLEURS and the voices
        run: |
          set -eu
          # Real speech: FLEURS (Google, CC-BY), people reading sentences, its dev split.
          for code in $(python3 -c "import sys; sys.path.insert(0, 'tools'); import stt_eval; print(' '.join(stt_eval.FLEURS.values()))"); do
            mkdir -p fleurs/$code
            base=https://huggingface.co/datasets/google/fleurs/resolve/main/data/$code
            curl -fsSL --retry 3 -o fleurs/$code/dev.tsv "$base/dev.tsv"
            curl -fsSL --retry 3 "$base/audio/dev.tar.gz" | tar xz -C fleurs/$code
          done
          # The voices of the languages whose articles show gender, for the faithfulness test.
          mkdir -p voices && cd voices
          for v in $(python3 -c "import json; print(' '.join(l['piperVoice'] for l in json.load(open('../app/src/main/assets/languages.json'))['languages'] if l.get('articles')))"); do
            curl -fsSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-$v.tar.bz2" | tar xj
          done
      - name: Pick the clips
        run: |
          pip install --quiet sherpa-onnx==1.13.8 soundfile numpy
          python tools/stt_eval.py prepare --fleurs fleurs --voices voices --out clips
      - uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips/

  recognize:
    needs: prepare
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Omnilingual, recognizer: omnilingual}
          - {name: Gemma 4 E2B, recognizer: gemma, repo: litert-community/gemma-4-E2B-it-litert-lm, file: gemma-4-E2B-it.litertlm}
          - {name: Gemma 4 E4B, recognizer: gemma, repo: litert-community/gemma-4-E4B-it-litert-lm, file: gemma-4-E4B-it.litertlm}
    name: recognize (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: clips
          path: clips/
      - name: Download the model
        run: |
          set -eu
          pip install --quiet sherpa-onnx==1.13.8 soundfile numpy litert-lm-api==0.19.1
          mkdir -p model
          if [ "${{ matrix.recognizer }}" = omnilingual ]; then
            curl -fsSL https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-omnilingual-asr-1600-languages-300M-ctc-int8-2025-11-12.tar.bz2 | tar xj -C model
          else
            curl -fsSL --retry 3 -o model/${{ matrix.file }} "https://huggingface.co/${{ matrix.repo }}/resolve/main/${{ matrix.file }}"
          fi
      - name: Recognize
        run: |
          if [ "${{ matrix.recognizer }}" = omnilingual ]; then model=model; else model=model/${{ matrix.file }}; fi
          python tools/stt_eval.py run --recognizer ${{ matrix.recognizer }} --model "$model" --name "${{ matrix.name }}" --clips clips --out "out/${{ strategy.job-index }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heard-${{ strategy.job-index }}
          path: out/

  report:
    needs: recognize
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: heard-*
          path: out/
          merge-multiple: true
      - name: Report
        run: python tools/stt_eval.py report out/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/
